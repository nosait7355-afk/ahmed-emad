<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ahmed Emad — غير متصل</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; padding: 32px; text-align: center;
        background: #050505; color: #fafafa;
        font-family: "Cairo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .icon { width: 72px; height: 72px; opacity: 0.85; }
      h1 { font-size: 20px; margin: 8px 0 0; }
      p { font-size: 14px; color: #8a8a8a; max-width: 320px; margin: 0; line-height: 1.7; }
      button {
        margin-top: 12px; padding: 12px 28px; border: 0; border-radius: 12px;
        background: #FF1A2D; color: #ffffff; font-size: 15px; font-weight: 700; cursor: pointer;
        font-family: inherit;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="1.6"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M1 1l22 22" />
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
      <line x1="12" y1="20" x2="12.01" y2="20" />
    </svg>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يبدو أنك غير متصل حاليًا. سيُعاد تحميل الصفحة تلقائيًا عند عودة الاتصال.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
    <script>
      // Auto-recover the moment connectivity returns.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
